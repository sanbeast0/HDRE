<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDRE — Hydro-Diplomacy & Resilience Engine | River-to-City AI</title>
  <meta name="description" content="HDRE connects transboundary river treaty allocations directly to municipal ward tap delivery. Closed-loop decision support for water resilience.">

  <!-- Google Fonts: Georgia Serif & Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- MapLibre GL JS & CSS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --ink: #edf4f2;
      --muted: #9aaba9;
      --line: rgba(218, 234, 230, 0.15);
      --water: #5cabc2;
      --water-glow: rgba(92, 171, 194, 0.35);
      --amber: #d8a35d;
      --mint: #a9e6c5;
      --danger: #f87171;
      --bg-dark: #071113;
      --bg-surface: rgba(10, 24, 27, 0.85);
      --bg-panel: rgba(8, 20, 22, 0.88);
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 14px; }
    body {
      background: var(--bg-dark);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; }

    /* --- HDRE Topbar --- */
    .hdre-topbar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 50;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 18, 20, 0.75);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 15px;
      color: var(--ink);
      cursor: pointer;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(180, 220, 211, 0.4);
      border-radius: 50%;
      color: var(--water);
      background: rgba(92, 171, 194, 0.12);
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-text strong {
      font-size: 14px;
      letter-spacing: 0.12em;
      line-height: 1.1;
      color: #ffffff;
    }
    .brand-text small {
      font-size: 9px;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 500;
    }

    .topbar-divider {
      width: 1px;
      height: 28px;
      background: var(--line);
    }

    /* Basin & Scenario selector */
    .basin-selector-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 34, 38, 0.7);
      border: 1px solid var(--line);
      padding: 5px 12px;
      border-radius: 4px;
    }
    .basin-selector-box select {
      background: transparent;
      color: #5cabc2;
      border: 0;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .basin-selector-box select option { background: #0b1517; color: #fff; }

    /* Viewport Switcher Pills */
    .view-pills {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 4px;
      border: 1px solid var(--line);
      margin-left: 6px;
    }
    .view-pill {
      padding: 5px 12px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .view-pill.active {
      background: rgba(92, 171, 194, 0.2);
      color: #d7e7df;
      border: 1px solid rgba(92, 171, 194, 0.45);
    }

    /* Topbar Actions */
    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-actions select {
      background: rgba(14, 34, 38, 0.7);
      color: #c4d7d0;
      border: 1px solid var(--line);
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .topbar-actions select option { background: #0b1517; }
    .topbar-btn {
      background: rgba(14, 34, 38, 0.7);
      color: #bdcbc5;
      border: 1px solid var(--line);
      padding: 5px 11px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .topbar-btn:hover { background: rgba(92, 171, 194, 0.18); color: #fff; border-color: var(--water); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      border: 1px solid rgba(169, 230, 197, 0.3);
      background: rgba(169, 230, 197, 0.12);
      color: #a9e6c5;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* --- Simulator Layout --- */
    .simulator-shell {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #081113;
    }
    .map-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .map-scene .maplibregl-map { position: absolute; inset: 0; }
    .scene-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.4s ease;
      background: radial-gradient(circle at 60% 40%, rgba(248, 113, 113, 0.22) 0%, rgba(216, 163, 93, 0.12) 45%, transparent 75%);
    }

    /* Left Layer Panel */
    .layer-panel {
      position: absolute;
      z-index: 10;
      top: 84px;
      bottom: 74px;
      left: 20px;
      width: 250px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(18px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    }
    .panel-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .layer-panel h2 {
      font-size: 26px;
      font-family: var(--font-serif);
      margin: 6px 0 16px;
      color: var(--ink);
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(216, 234, 226, 0.08);
      font-size: 12px;
      color: #c9d6d1;
      cursor: pointer;
    }
    .layer-item input { accent-color: var(--water); cursor: pointer; }
    .layer-dot { width: 8px; height: 8px; border-radius: 50%; }
    .layer-tag {
      margin-left: auto;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 4px;
      border-radius: 2px;
    }

    /* Fly Buttons in Layer Panel */
    .fly-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .fly-btn {
      padding: 6px 8px;
      background: rgba(14, 34, 38, 0.7);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: center;
      cursor: pointer;
    }
    .fly-btn:hover { background: rgba(92, 171, 194, 0.2); border-color: var(--water); }

    /* Right Analytics Panel */
    .analytics-panel {
      position: absolute;
      z-index: 10;
      top: 84px;
      bottom: 74px;
      right: 20px;
      width: min(420px, 36vw);
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      padding: 18px 20px 0;
    }
    .panel-head-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .panel-head-title h3 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .panel-head-title p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Tabs Bar */
    .tabs-bar {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      border-bottom: 1px solid var(--line);
      margin-top: 12px;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 10px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active {
      color: var(--ink);
      border-bottom-color: var(--water);
      background: rgba(92, 171, 194, 0.08);
    }

    .analytics-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .analytics-content h2 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 400;
      margin: 4px 0 6px;
    }
    .analytics-copy {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* Slider Block */
    .slider-block {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(216, 234, 226, 0.1);
      border-radius: 5px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .slider-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .slider-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--water);
    }
    .slider-val.danger { color: #f87171; }
    .slider-val.warning { color: #fbbf24; }
    .hdre-slider {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: #142529;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .hdre-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--water);
      box-shadow: 0 0 8px var(--water-glow);
      border: 2px solid #ffffff;
      cursor: pointer;
    }
    .slider-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--muted);
      margin-top: 4px;
      font-family: var(--font-mono);
    }

    /* Live 5-Step Treaty-to-Tap Ribbon */
    .cascade-ribbon {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 12px;
      margin-top: 14px;
    }
    .cascade-step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 11px;
      border-bottom: 1px dashed rgba(216, 234, 226, 0.1);
    }
    .cascade-step:last-child { border-bottom: none; }
    .step-idx {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(92, 171, 194, 0.2);
      color: var(--water);
      font-size: 9px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 6px;
    }

    /* Interactive Map Node Inspector Card */
    .map-node-card {
      position: absolute;
      top: 84px;
      left: 284px;
      width: 300px;
      background: var(--bg-panel);
      border: 1px solid var(--water);
      border-radius: 6px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
      backdrop-filter: blur(18px);
      padding: 16px;
      z-index: 20;
      animation: popIn 0.2s ease;
    }
    @keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom 20-Year Macro Timeline Slider */
    .timeline-bar {
      position: absolute;
      z-index: 10;
      left: 20px;
      right: 20px;
      bottom: 18px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(16px);
      font-size: 11px;
      color: var(--muted);
    }
    .timeline-bar strong { color: var(--ink); letter-spacing: 0.1em; font-size: 10px; }
    .timeline-bar input { flex: 1; accent-color: var(--water); }

    /* --- Viewport 2: Municipal Ward Cockpit --- */
    .cockpit-view {
      position: relative;
      height: calc(100vh - 64px);
      margin-top: 64px;
      padding: 24px 32px;
      overflow-y: auto;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }
    .cockpit-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 22px;
    }
    .cockpit-header-row h1 {
      font-size: 24px;
      font-family: var(--font-serif);
      font-weight: 400;
      color: var(--ink);
    }
    .cockpit-header-row p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: rgba(10, 24, 27, 0.7);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px 18px;
      position: relative;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--water);
    }
    .kpi-card.pass::before { background: #10b981; }
    .kpi-card.locked::before { background: #38bdf8; }
    .kpi-card.amber::before { background: var(--amber); }
    .kpi-card-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    .kpi-card-val {
      font-size: 26px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--ink);
      margin: 6px 0 2px;
    }
    .kpi-card-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .cockpit-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
    }
    .cockpit-card {
      background: rgba(10, 24, 27, 0.7);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
    }
    .cockpit-card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }

    .ward-tile-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .ward-tile {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ward-tile:hover {
      border-color: var(--water);
      background: rgba(92, 171, 194, 0.1);
    }
    .ward-tile.selected {
      border-color: var(--water);
      background: rgba(92, 171, 194, 0.15);
      box-shadow: 0 0 12px rgba(92, 171, 194, 0.2);
    }
    .ward-tile strong {
      display: block;
      font-size: 12px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 2px 0 4px;
    }
    .ward-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-safe { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-alert { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-deficit { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Primary Action Buttons */
    .action-btn-primary {
      background: #dbe7df;
      color: #11201d;
      padding: 10px 16px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* Audit Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
    }
    .drawer-body {
      width: 440px;
      max-width: 90vw;
      background: #091518;
      border-left: 1px solid var(--line);
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    .audit-terminal {
      background: #020608;
      border: 1px solid rgba(216, 234, 226, 0.1);
      border-radius: 4px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      flex: 1;
      overflow-y: auto;
      margin: 16px 0;
      line-height: 1.6;
    }
    .audit-terminal code { display: block; margin-bottom: 4px; }
    .audit-terminal code span.action { color: #a9e6c5; }
    .audit-terminal code span.val { color: #38bdf8; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(216, 234, 226, 0.2); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Lucide Icon Helper ---
    function Icon({ name, size = 15, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (size) i.setAttribute('data-size', size);
          ref.current.appendChild(i);
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, size]);
      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, display: 'inline-flex' }} />;
    }

    // --- Multilingual Localization ---
    const I18N = {
      EN: {
        basinCauvery: "Cauvery basin · KRS to Bengaluru",
        basinKrishna: "Krishna-Bhima basin · Khadakwasla to Pune",
        viewTwin: "Macro Digital Twin",
        viewCockpit: "Municipal Cockpit",
        tabWhatIf: "WHAT-IF",
        tabTreaty: "TREATY",
        tabWards: "WARDS",
        tabRationing: "RATIONING",
        tabMediation: "AI MEDIATION",
        tabCompare: "COMPARE",
        tabSensitivity: "SENSITIVITY",
        tabAlerts: "ALERTS",
        weatherShockTitle: "Weather shock.",
        weatherShockSub: "Stress the basin and watch water, haze, and ward risk respond live.",
        rainShock: "Rainfall shock",
        tempSurge: "Temperature surge",
        releaseCut: "Upstream release cut",
        popSurge: "Urban population surge",
        statutoryFloor: "Protected Human Baseline ≥ 55 LPCD",
        hospitalBuffer: "Hospital Reserve: 100% Locked",

    // --- Dynamic 3D Satellite MapLibre Scene ---
    function MapScene({ basin, rainfall, release, temp, layers, onSelectNode }) {
      const mapContainer = useRef(null);
      const mapInstance = useRef(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        if (!window.maplibregl || !mapContainer.current) return;

        try {
          const map = new window.maplibregl.Map({
            container: mapContainer.current,
            style: {
              version: 8,
              sources: {
                'satellite-imagery': {
                  type: 'raster',
                  tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                  tileSize: 256,
                  attribution: 'ESRI World Imagery'
                }
              },
              layers: [{ id: 'satellite-base', type: 'raster', source: 'satellite-imagery', minzoom: 0, maxzoom: 19 }]
            },
            center: [basin.corridorCenter.lng, basin.corridorCenter.lat],
            zoom: basin.corridorCenter.zoom,
            pitch: 54,
            bearing: -12,
            attributionControl: false
          });

          map.addControl(new window.maplibregl.NavigationControl({ showCompass: true }), 'bottom-left');

          map.on('load', () => {
            setReady(true);

            // 1. Reservoir Source & Layers
            map.addSource('reservoir-src', {
              type: 'geojson',
              data: buildReservoirGeoJson(basin.dam, rainfall)
            });
            map.addLayer({
              id: 'reservoir-fill',
              type: 'fill',
              source: 'reservoir-src',
              paint: { 'fill-color': '#3eaec7', 'fill-opacity': 0.72 }
            });
            map.addLayer({
              id: 'reservoir-line',
              type: 'line',
              source: 'reservoir-src',
              paint: { 'line-color': '#cbeff5', 'line-width': 2 }
            });

            // 2. River Corridor
            map.addSource('river-src', {
              type: 'geojson',
              data: buildRiverGeoJson(basin.dam, basin.city)
            });
            map.addLayer({
              id: 'river-line',
              type: 'line',
              source: 'river-src',
              paint: { 'line-color': '#55b3c8', 'line-width': 4.2, 'line-opacity': 0.85 }
            });

            // 3. Ward Risk Polygons
            map.addSource('wards-src', {
              type: 'geojson',
              data: buildWardsGeoJson(basin.city, basin.wards, rainfall, temp, release)
            });
            map.addLayer({
              id: 'wards-fill',
              type: 'fill',
              source: 'wards-src',
              paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.58 }
            });
            map.addLayer({
              id: 'wards-line',
              type: 'line',
              source: 'wards-src',
              paint: { 'line-color': ['get', 'borderColor'], 'line-width': 2 }
            });

            map.on('click', 'wards-fill', (e) => {
              if (e.features && e.features[0]) {
                onSelectNode(e.features[0].properties);
              }
            });

            mapInstance.current = map;
          });

          return () => {
            if (mapInstance.current) {
              mapInstance.current.remove();
              mapInstance.current = null;
            }
          };
        } catch (e) {
          console.warn("MapLibre init fallback:", e);
        }
      }, [basin.key]);

      // Reactively Update Geometries when Sliders Change
      useEffect(() => {
        if (!mapInstance.current || !ready) return;
        const map = mapInstance.current;

        // Dynamic Reservoir Shrink/Expand & Color Shift
        const resSrc = map.getSource('reservoir-src');
        if (resSrc) {
          resSrc.setData(buildReservoirGeoJson(basin.dam, rainfall));
          const color = rainfall < -25 ? '#806958' : rainfall < 0 ? '#4397a6' : '#2ca5bf';
          map.setPaintProperty('reservoir-fill', 'fill-color', color);
        }

        // River Corridor Line Width
        if (map.getLayer('river-line')) {
          const flumeWidth = Math.max(1.5, 4.2 * (1 + (rainfall * 0.4 - release * 0.8) / 100));
          map.setPaintProperty('river-line', 'line-width', flumeWidth);
        }

        // Ward Deficit Colors
        const wardSrc = map.getSource('wards-src');
        if (wardSrc) {
          wardSrc.setData(buildWardsGeoJson(basin.city, basin.wards, rainfall, temp, release));
        }
      }, [rainfall, release, temp, ready, basin.key]);

      // Reactively Toggle Layers
      useEffect(() => {
        if (!mapInstance.current || !ready) return;
        const map = mapInstance.current;
        if (map.getLayer('reservoir-fill')) {
          map.setLayoutProperty('reservoir-fill', 'visibility', layers.reservoir ? 'visible' : 'none');
          map.setLayoutProperty('reservoir-line', 'visibility', layers.reservoir ? 'visible' : 'none');
        }
        if (map.getLayer('river-line')) {
          map.setLayoutProperty('river-line', 'visibility', layers.corridor ? 'visible' : 'none');
        }
        if (map.getLayer('wards-fill')) {
          map.setLayoutProperty('wards-fill', 'visibility', layers.wards ? 'visible' : 'none');
          map.setLayoutProperty('wards-line', 'visibility', layers.wards ? 'visible' : 'none');
        }
      }, [layers, ready]);

      function buildReservoirGeoJson(dam, rain) {
        const scale = 1 + (rain / 100) * 0.6;
        const rx = Math.max(0.02, 0.065 * scale);
        const ry = Math.max(0.015, 0.045 * scale);
        const coords = [];
        for (let i = 0; i <= 36; i++) {
          const a = (i / 36) * Math.PI * 2;
          coords.push([dam.lng + Math.cos(a) * rx, dam.lat + Math.sin(a) * ry]);
        }
        return {
          type: 'Feature',
          properties: { name: dam.name },
          geometry: { type: 'Polygon', coordinates: [coords] }
        };
      }

      function buildRiverGeoJson(dam, city) {
        const points = [];
        for (let i = 0; i <= 50; i++) {
          const t = i / 50;
          const lng = dam.lng + t * (city.lng - dam.lng) + Math.sin(t * 12) * 0.018;
          const lat = dam.lat + t * (city.lat - dam.lat) + Math.sin(t * 8) * 0.014;
          points.push([lng, lat]);
        }
        return {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: points }
        };
      }

      function buildWardsGeoJson(city, list, rain, tSurge, relCut) {
        const features = list.map((w, idx) => {
          const a = (idx / list.length) * Math.PI * 2;
          const dist = 0.038 + (idx % 2) * 0.02;
          const cx = city.lng + Math.cos(a) * dist;
          const cy = city.lat + Math.sin(a) * dist;
          const sz = 0.018;

          const def = Math.min(95, Math.max(5, Math.round(w.baseDeficit + Math.max(0, -rain * 0.6) + tSurge * 3.5 + relCut * 0.75)));
          const lpcd = Math.max(55, Math.round(135 - def * 0.85));
          const color = def > 45 ? '#f87171' : def > 25 ? '#fbbf24' : '#34d399';
          const borderColor = def > 45 ? '#fca5a5' : def > 25 ? '#fde68a' : '#a7f3d0';

          return {
            type: 'Feature',
            properties: { id: w.id, name: w.name, pop: w.pop, elev: w.elev, deficit: def, lpcd, color, borderColor },
            geometry: {
              type: 'Polygon',
              coordinates: [[[cx - sz, cy - sz], [cx + sz, cy - sz], [cx + sz, cy + sz], [cx - sz, cy + sz], [cx - sz, cy - sz]]]
            }
          };
        });
        return { type: 'FeatureCollection', features };
      }

      const fly = (target) => {
        if (!mapInstance.current) return;
        mapInstance.current.flyTo({
          center: [target.lng, target.lat],
          zoom: target.zoom || 11.5,
          pitch: 56,
          duration: 1600
        });
      };

      return (
        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
          <div ref={mapContainer} className="map-scene" />
          <div
            className="scene-wash"
            style={{ opacity: Math.max(0.04, Math.min(0.65, (Math.abs(Math.min(0, rainfall)) * 0.01) + (temp * 0.08))) }}
          />
        </div>
      );
    }

    // --- Main HDRE App Root ---
    function App() {

      const [lang, setLang] = useState('EN');

      const [auditOpen, setAuditOpen] = useState(false);

      // What-If Sliders
      const [rainfall, setRainfall] = useState(0);
      const [temperature, setTemperature] = useState(2);
      const [releaseCut, setReleaseCut] = useState(0);
      const [populationSurge, setPopulationSurge] = useState(0);
      const [treatyRatio, setTreatyRatio] = useState(55);
      const [progress, setProgress] = useState(0.55);

      // Layers Toggle
      const [layers, setLayers] = useState({
        reservoir: true,
        wards: true,
        corridor: true
      });

      // Selected Node
      const [selectedNode, setSelectedNode] = useState(null);
      const [selectedWardId, setSelectedWardId] = useState('W01');
      const [radarHorizon, setRadarHorizon] = useState('60d');

      // Audit Logs
      const [auditLogs, setAuditLogs] = useState([
        { time: "19:00:10", action: "HDRE_ONLINE", detail: "FastAPI REST telemetry connected. CWC & IMD live data active." },
        { time: "19:02:15", action: "FLOOR_LOCKED", detail: "Statutory human baseline floor ≥ 55 LPCD strictly enforced." },
        { time: "19:04:40", action: "HOSPITAL_BUFFER", detail: "Critical hospital reserves 100% locked (Zero deficit guaranteed)." }
      ]);

      const log = (action, detail) => {
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        setAuditLogs(prev => [{ time, action, detail }, ...prev]);
      };

      const basin = BASINS[basinKey];
      const t = I18N[lang] || I18N.EN;

      // Derived Metrics
      const liveMetrics = useMemo(() => {
        const stress = Math.abs(Math.min(0, rainfall)) * 0.6 + temperature * 3.5 + releaseCut * 0.8;
        const bulkSupply = Math.max(480, Math.round(basin.bulkBaselineMLD * (1 - (releaseCut * 0.012) + (rainfall * 0.004))));
        const avgLpcd = Math.max(55, Math.round(112 - stress * 0.7));
        const hospitalReserved = basinKey === 'Cauvery' ? 0.94 : 0.888;
        const pumpingCost = Math.round(93 + stress * 0.45);

              {selectedNode && (
                <div className="map-node-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <span className="panel-kicker">SCADA NODE INSPECTION</span>
                      <h4 style={{ fontSize: '14px', fontWeight: 700, color: 'var(--ink)' }}>{selectedNode.name}</h4>
                    </div>
                    <button onClick={() => setSelectedNode(null)} style={{ color: 'var(--muted)' }}>
                      <Icon name="x" size={14} />
                    </button>
                  </div>
                  <div style={{ marginTop: '10px', fontSize: '11px', display: 'flex', flexDirection: 'column', gap: '5px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--muted)' }}>Population:</span><strong>{selectedNode.pop}</strong>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--muted)' }}>Elevation Head:</span><strong>{selectedNode.elev}m</strong>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--muted)' }}>Deficit Forecast:</span>
                      <strong style={{ color: selectedNode.deficit > 30 ? '#f87171' : 'var(--mint)' }}>{selectedNode.deficit}%</strong>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ color: 'var(--muted)' }}>Delivered Water:</span>
                      <strong style={{ color: 'var(--water)', fontFamily: 'var(--font-mono)' }}>{selectedNode.lpcd} LPCD</strong>
                    </div>
                  </div>
                  <div style={{ marginTop: '12px', display: 'flex', gap: '6px' }}>
                    <button
                      className="action-btn-primary"
                      style={{ flex: 1, justifyContent: 'center', padding: '7px 8px', fontSize: '10px' }}
                      onClick={() => {
                        log("SCADA_THROTTLE", `Throttled commercial valve on ${selectedNode.name}`);
                        alert(`SCADA command dispatched: Valve throttled on ${selectedNode.name}. Saved 12% flow.`);
                      }}
                    >
                      Throttle Valve
                    </button>
                    <button
                      className="topbar-btn"
                      style={{ flex: 1, justifyContent: 'center', padding: '7px 8px', fontSize: '10px' }}
                      onClick={() => {
                        log("SCADA_POTABLE", `Prioritized drinking line on ${selectedNode.name}`);
                        alert(`Drinking water floor secured on ${selectedNode.name} at ≥ 55 LPCD.`);
                      }}
                    >
                      Prioritize Potable
                    </button>
                  </div>
                </div>
              )}

              {/* Bottom 20-Year Timeline Slider */}
              <div className="timeline-bar">
                <strong>MACRO 20 YR</strong>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={progress}
                  onChange={(e) => setProgress(Number(e.target.value))}
                />
                <span>2026 <b>●</b> 2046</span>
                <button
                  className="topbar-btn"
                  onClick={() => setActiveTab('WHAT-IF')}
                  style={{ marginLeft: 'auto' }}
                >
                  <Icon name="sliders-horizontal" size={13} /> 90-DAY MICRO
                </button>
              </div>
            </main>
          )}

          {/* VIEWPORT 2: MUNICIPAL WARD COCKPIT */}
          {view === 'cockpit' && (
            <div className="cockpit-view">
              <div className="cockpit-header-row">
                <div>
                  <span className="status-badge" style={{ marginBottom: '6px' }}>VIEWPORT 2</span>
                  <h1>Municipal Ward Resilience Cockpit</h1>
                  <p>{basin.city.name} · XGBoost Forecasts & Google OR-Tools MILP Valve Scheduling</p>
                </div>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <div className="view-pills">
                    {['30d', '60d', '90d'].map(h => (
                      <button
                        key={h}
                        className={`view-pill ${radarHorizon === h ? 'active' : ''}`}
                        onClick={() => setRadarHorizon(h)}
                      >
                        {h} Radar
                      </button>
                    ))}
                  </div>
                  <button className="action-btn-primary" onClick={optimizeWardRationing}>
                    <Icon name="sliders" size={14} /> {t.optimizeRationing}
                  </button>
                </div>
              </div>

              {/* 4 KPI Stat Cards */}
              <div className="kpi-row">
                <div className="kpi-card pass">
                  <span className="kpi-card-label">STATUTORY HUMAN FLOOR</span>
                  <div className="kpi-card-val">55 LPCD</div>
                  <span className="kpi-card-sub" style={{ color: '#10b981' }}>
                    PASS ≥ 55.0 LPCD (Hard Floor)
                  </span>
                </div>

                <div className="kpi-card locked">
                  <span className="kpi-card-label">HOSPITAL RESERVE BUFFER</span>
                  <div className="kpi-card-val">100%</div>
                  <span className="kpi-card-sub" style={{ color: '#38bdf8' }}>
                    Zero Deficit Guaranteed
                  </span>
                </div>

                <div className="kpi-card amber">
                  <span className="kpi-card-label">PUMPING ENERGY COST</span>
                  <div className="kpi-card-val">₹{liveMetrics.pumpingCost}k <span style={{ fontSize: '13px', fontWeight: 400 }}>/ day</span></div>
                  <span className="kpi-card-sub">Elevation Head Optimized</span>
                </div>

                <div className="kpi-card">
                  <span className="kpi-card-label">BULK INTAKE FLUME</span>
                  <div className="kpi-card-val">{liveMetrics.bulkSupply} <span style={{ fontSize: '13px', fontWeight: 400 }}>MLD</span></div>
                  <span className="kpi-card-sub">Avg Ward: {liveMetrics.avgLpcd} LPCD</span>
                </div>
              </div>

              {/* Cockpit Grid */}
              <div className="cockpit-grid">
                {/* Left: Ward Tiles */}
                <div className="cockpit-card">
                  <div className="cockpit-card-title">
                    <span>WARD CHOROPLETH DEFICIT GRID ({basin.city.name.toUpperCase()})</span>
                    <div style={{ display: 'flex', gap: '8px', fontSize: '10px' }}>
                      <span style={{ color: '#10b981' }}>● Safe</span>
                      <span style={{ color: '#fbbf24' }}>■ Alert</span>
                      <span style={{ color: '#f87171' }}>▲ Deficit</span>
                    </div>
                  </div>

                  <div className="ward-tile-grid">
                    {basin.wards.map(w => {
                      const def = Math.min(95, Math.max(5, Math.round(w.baseDeficit + Math.max(0, -rainfall * 0.6) + temperature * 3.5 + releaseCut * 0.75)));
                      const isAlert = def > 25;
                      const isDeficit = def > 45;
                      const badgeClass = isDeficit ? 'badge-deficit' : isAlert ? 'badge-alert' : 'badge-safe';
                      const badgeText = isDeficit ? 'DEFICIT' : isAlert ? 'ALERT' : 'SAFE';

                      return (
                        <div
                          key={w.id}
                          className={`ward-tile ${selectedWardId === w.id ? 'selected' : ''}`}
                          onClick={() => setSelectedWardId(w.id)}
                        >
                          <span style={{ fontSize: '9px', color: 'var(--muted)', fontFamily: 'var(--font-mono)' }}>{w.id}</span>
                          <strong>{w.name}</strong>
                          <span className={`ward-badge ${badgeClass}`}>{badgeText}</span>
                          <div style={{ fontSize: '11px', fontFamily: 'var(--font-mono)', color: 'var(--water)', marginTop: '6px' }}>
                            {def}% Deficit
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Right: Ward Detail */}
                <div className="cockpit-card">
                  <div className="cockpit-card-title">
                    <div>
                      <span style={{ fontSize: '9px', fontFamily: 'var(--font-mono)', color: 'var(--muted)' }}>{currentWard.id}</span>
                      <h3 style={{ fontSize: '16px', color: 'var(--ink)', marginTop: '2px' }}>{currentWard.name}</h3>
                    </div>
                    <span className="ward-badge badge-alert">OPERATIONAL</span>
                  </div>

                  <p style={{ fontSize: '11px', color: 'var(--muted)', marginBottom: '14px' }}>
                    Population: {currentWard.pop} · Elevation Head: {currentWard.elev}m
                  </p>

                  {/* 30-60-90 Radar Block */}
                  <div style={{ background: 'rgba(0,0,0,0.3)', padding: '12px', borderRadius: '4px', border: '1px solid var(--line)', marginBottom: '16px' }}>
                    <span style={{ fontSize: '9px', color: 'var(--muted)', textTransform: 'uppercase', fontWeight: 700 }}>
                      30-60-90 DAY DEFICIT RADAR (XGBOOST FORECAST)
                    </span>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', textAlign: 'center', marginTop: '8px' }}>
                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: '8px', borderRadius: '3px' }}>
                        <span style={{ fontSize: '9px', color: 'var(--muted)' }}>30-Day</span>
                        <div style={{ fontSize: '14px', fontWeight: 700, color: 'var(--water)', fontFamily: 'var(--font-mono)' }}>-3.5%</div>
                      </div>
                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: '8px', borderRadius: '3px' }}>
                        <span style={{ fontSize: '9px', color: 'var(--muted)' }}>60-Day</span>
                        <div style={{ fontSize: '14px', fontWeight: 700, color: '#fbbf24', fontFamily: 'var(--font-mono)' }}>-18.1%</div>
                      </div>
                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: '8px', borderRadius: '3px' }}>
                        <span style={{ fontSize: '9px', color: 'var(--muted)' }}>90-Day</span>
                        <div style={{ fontSize: '14px', fontWeight: 700, color: '#f87171', fontFamily: 'var(--font-mono)' }}>-18.2%</div>
                      </div>
                    </div>
                  </div>

                  {/* Water Delivery */}
                  <div style={{ marginBottom: '14px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', marginBottom: '4px' }}>
                      <span style={{ color: 'var(--muted)' }}>{t.deliveredTap}:</span>
                      <strong style={{ color: 'var(--water)', fontFamily: 'var(--font-mono)' }}>55 LPCD (PASS ≥ 55)</strong>
                    </div>
                    <div style={{ height: '6px', background: 'rgba(0,0,0,0.4)', borderRadius: '3px', overflow: 'hidden' }}>
                      <div style={{ width: '65%', height: '100%', background: 'var(--water)' }} />
                    </div>
                  </div>

                  {/* Hospital Reserve */}
                  <div style={{ marginBottom: '18px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', marginBottom: '4px' }}>
                      <span style={{ color: 'var(--muted)' }}>Hospital Buffer (Zero Deficit):</span>
                      <strong style={{ color: '#10b981', fontFamily: 'var(--font-mono)' }}>100% LOCKED</strong>
                    </div>
                    <div style={{ height: '6px', background: 'rgba(0,0,0,0.4)', borderRadius: '3px', overflow: 'hidden' }}>
                      <div style={{ width: '100%', height: '100%', background: '#10b981' }} />
                    </div>
                  </div>

                  <button
                    className="action-btn-primary"
                    style={{ width: '100%', justifyContent: 'center' }}
                    onClick={() => {
                      log("VALVE_ACTUATED", `Updated SCADA setpoint for ${currentWard.name}`);
                      alert(`Valve setpoint dispatched for ${currentWard.name}.\nDelivered quota maintained at ≥ 55 LPCD.`);
                    }}
                  >
                    <Icon name="check-check" size={14} /> Dispatch Ward Valve Setpoint
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* COMPLIANCE AUDIT MODAL DRAWER */}
          {auditOpen && (
            <div className="drawer-overlay" onClick={() => setAuditOpen(false)}>
              <div className="drawer-body" onClick={(e) => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h3 style={{ fontSize: '16px', fontWeight: 700, display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <Icon name="shield-check" size={17} /> Compliance Audit Trail
                  </h3>
                  <button onClick={() => setAuditOpen(false)} style={{ color: 'var(--muted)' }}>
                    <Icon name="x" size={17} />
                  </button>
                </div>
                <p style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '4px' }}>
                  All treaty optimizations, weather shocks, and SCADA valve adjustments are recorded with timestamps.
                </p>

                <div className="audit-terminal">
                  {auditLogs.map((item, idx) => (
                    <code key={idx}>
                      [{item.time}] <span className="action">{item.action}</span>: <span className="val">{item.detail}</span>
                    </code>
                  ))}
                </div>

                <div style={{ display: 'flex', gap: '8px' }}>
                  <button
                    className="action-btn-primary"
                    style={{ flex: 1, justifyContent: 'center' }}
                    onClick={() => {
                      const jsonStr = JSON.stringify(auditLogs, null, 2);
                      const blob = new Blob([jsonStr], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `HDRE_Audit_${Date.now()}.json`;
                      a.click();
                    }}
                  >
                    <Icon name="download" size={13} /> Export (.JSON)
                  </button>
                  <button
                    className="topbar-btn"
                    style={{ flex: 1, justifyContent: 'center' }}
                    onClick={() => setAuditLogs([{ time: new Date().toLocaleTimeString(), action: "LOG_CLEARED", detail: "Buffer reset." }])}
                  >
                    Clear Log
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
