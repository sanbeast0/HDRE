<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydro-Diplomacy & Resilience Engine (HDRE / R2C Ai)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309',
              800: '#92400e', 900: '#78350f', 950: '#451a03'
            },
            yellow: {
              50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047',
              400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207',
              800: '#854d0e', 900: '#713f12', 950: '#422006'
            },
            hydro: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
              400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
              800: '#075985', 900: '#0c4a6e', 950: '#082f49'
            },
            slate: {
              850: '#151e2e',
              950: '#070d18'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel for in-browser JSX execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Theme Transition */
    html {
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    html.light {
      background-color: #fbfbfa;
      color: #0f172a;
    }
    html.dark {
      background-color: #080c15;
      color: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    html.light ::-webkit-scrollbar-track { background: #f1f5f9; }
    html.light ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    html.light ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    html.dark ::-webkit-scrollbar-track { background: #0b1324; }
    html.dark ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    html.dark ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Glass Panels */
    html.light .glass-panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px -2px rgba(245, 158, 11, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }
    html.dark .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.20);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Range slider custom styling */
    input[type=range] {
      accent-color: #f59e0b;
    }
  </style>
</head>
<body class="min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <!-- In-browser React Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide Icon Helper ---
    function Icon({ name, className = "w-4 h-4" }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className}></i>;
    }

    // --- App Component ---
    function App() {
      // Theme State: 'light' or 'dark' (defaults to 'light' per user request)
      const [theme, setTheme] = useState('light');
      const [currentView, setCurrentView] = useState('municipal'); // 'treaty' | 'municipal' | 'closed-loop' | 'analytics'
      const [scenario, setScenario] = useState('2026_DROUGHT_RCP85');
      const [treatyData, setTreatyData] = useState(null);
      const [municipalData, setMunicipalData] = useState(null);
      const [wardsGeojson, setWardsGeojson] = useState(null);
      const [isSolving, setIsSolving] = useState(false);
      
      // Sliders & Stressor States
      const [alphaStorage, setAlphaStorage] = useState(64.2);
      const [betaStorage, setBetaStorage] = useState(38.5);
      const [inflow, setInflow] = useState(14.1);
      const [precipDeficit, setPrecipDeficit] = useState(-30.0);
      const [tempSurge, setTempSurge] = useState(2.5);
      const [monsoonStressorOn, setMonsoonStressorOn] = useState(true);
      const [heatwaveStressorOn, setHeatwaveStressorOn] = useState(true);
      const [bulkQuotaMld, setBulkQuotaMld] = useState(850.0);
      const [horizonDays, setHorizonDays] = useState(60);
      const [selectedWard, setSelectedWard] = useState(null);
      const [closedLoopSliderTmc, setClosedLoopSliderTmc] = useState(38.9);
      const [searchFilter, setSearchFilter] = useState('');

      // Theme toggle effect on <html>
      const toggleTheme = () => {
        const next = theme === 'light' ? 'dark' : 'light';
        setTheme(next);
        if (next === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      };

      // Initial Data Fetch
      useEffect(() => {
        async function fetchInitial() {
          try {
            setIsSolving(true);
            const [gRes, tRes, mRes] = await Promise.all([
              fetch('/api/v1/geojson/wards').then(r => r.ok ? r.json() : null).catch(() => null),
              fetch('/api/v1/treaty/simulate-maximin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  basin_id: "KRISHNA_BHIMA_01",
                  dam_alpha_storage_tmc: 64.2,
                  dam_beta_storage_tmc: 38.5,
                  projected_inflow_tmc: 14.1,
                  climate_shock: { precip_deficit_pct: -30.0, temp_surge_c: 2.5 }
                })
              }).then(r => r.ok ? r.json() : null).catch(() => null),
              fetch('/api/v1/municipal/optimize-ward-rationing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  city_id: "PUNE_METRO",
                  allocated_bulk_quota_mld: 850.0,
                  forecast_horizon_days: 60
                })
              }).then(r => r.ok ? r.json() : null).catch(() => null)
            ]);

            if (gRes) setWardsGeojson(gRes);
            if (tRes) {
              setTreatyData(tRes);
              setClosedLoopSliderTmc(tRes.optimal_release_state_a_tmc || 38.9);
            }
            if (mRes) {
              setMunicipalData(mRes);
              const w14 = mRes.ward_details?.find(w => w.ward_id === 'WARD_14') || mRes.ward_details?.[0];
              setSelectedWard(w14);
            }
          } finally {
            setIsSolving(false);
          }
        }
        fetchInitial();
      }, []);

      // Trigger Treaty Solver
      const runTreatySolver = async (params) => {
        try {
          setIsSolving(true);
          const p = params || {
            dam_alpha_storage_tmc: Number(alphaStorage),
            dam_beta_storage_tmc: Number(betaStorage),
            projected_inflow_tmc: Number(inflow),
            climate_shock: {
              precip_deficit_pct: Number(precipDeficit),
              temp_surge_c: Number(tempSurge)
            }
          };
          const res = await fetch('/api/v1/treaty/simulate-maximin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(p)
          });
          if (res.ok) {
            const data = await res.json();
            setTreatyData(data);
            setClosedLoopSliderTmc(data.optimal_release_state_a_tmc);
          }
        } finally {
          setIsSolving(false);
        }
      };

      // Trigger Municipal Optimizer
      const runMunicipalOptimizer = async (quota = bulkQuotaMld, horizon = horizonDays) => {
        try {
          setIsSolving(true);
          const res = await fetch('/api/v1/municipal/optimize-ward-rationing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              city_id: "PUNE_METRO",
              allocated_bulk_quota_mld: Number(quota),
              forecast_horizon_days: Number(horizon)
            })
          });
          if (res.ok) {
            const data = await res.json();
            setMunicipalData(data);
            if (selectedWard) {
              const updated = data.ward_details?.find(w => w.ward_id === selectedWard.ward_id);
              if (updated) setSelectedWard(updated);
            }
          }
        } finally {
          setIsSolving(false);
        }
      };

      // Shift closed loop upstream release
      const handleClosedLoopShift = async (deltaTmc) => {
        const newReleaseA = Math.max(10.0, Math.min(65.0, closedLoopSliderTmc + deltaTmc));
        setClosedLoopSliderTmc(newReleaseA);
        const derivedMld = Math.round((newReleaseA * 28316.85 * 0.28) / 365.0);
        setBulkQuotaMld(derivedMld);
        await runMunicipalOptimizer(derivedMld, horizonDays);
      };

      // Plotly re-draw on view or theme change
      useEffect(() => {
        if (currentView === 'analytics' && window.Plotly) {
          const isDark = theme === 'dark';
          const bgCol = isDark ? '#0f172a' : '#ffffff';
          const txtCol = isDark ? '#94a3b8' : '#334155';
          const gridCol = isDark ? '#1e293b' : '#f1f5f9';

          // 1. Pareto Frontier Plot
          const paretoPts = treatyData?.pareto_points || [
            [0.15, 0.92], [0.35, 0.88], [0.55, 0.82], [0.72, 0.74], [0.85, 0.45], [0.93, 0.20]
          ];
          const secA = treatyData?.state_a_security || 0.74;
          const secB = treatyData?.state_b_security || 0.72;

          window.Plotly.newPlot('plotly-pareto', [
            {
              x: paretoPts.map(p => p[0]),
              y: paretoPts.map(p => p[1]),
              mode: 'lines+markers',
              name: 'Pareto Frontier',
              line: { color: '#f59e0b', width: 3, shape: 'spline' },
              marker: { color: '#d97706', size: 6 }
            },
            {
              x: [secA],
              y: [secB],
              mode: 'markers+text',
              name: 'Rawlsian Maximin R*',
              marker: { color: '#10b981', size: 14, symbol: 'star' },
              text: [`Maximin (${(treatyData?.maximin_security_score || 0.74).toFixed(3)})`],
              textposition: 'top right',
              textfont: { color: '#10b981', size: 12, family: 'monospace' }
            }
          ], {
            title: { text: 'Non-Dominated Pareto Trade-Off Frontier (Rawlsian Equilibrium)', font: { color: isDark ? '#f8fafc' : '#0f172a', size: 13 } },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: bgCol,
            xaxis: { title: 'State A Welfare Security (Upstream)', color: txtCol, gridcolor: gridCol },
            yaxis: { title: 'State B Welfare Security (Downstream)', color: txtCol, gridcolor: gridCol },
            legend: { font: { color: txtCol } },
            margin: { l: 50, r: 30, t: 40, b: 50 }
          }, { responsive: true, displayModeBar: false });

          // 2. Pressure Hydrograph
          const wards = municipalData?.ward_details || [];
          window.Plotly.newPlot('plotly-pressure', [
            {
              x: wards.map(w => w.ward_id.replace('WARD_', 'W')),
              y: wards.map(w => w.estimated_terminal_pressure_bar),
              type: 'bar',
              marker: {
                color: wards.map(w => w.estimated_terminal_pressure_bar < 1.0 ? '#ef4444' : (w.estimated_terminal_pressure_bar < 1.3 ? '#f59e0b' : '#10b981'))
              }
            }
          ], {
            title: { text: 'Ward Terminal Hydraulic Head Pressure (Bar)', font: { color: isDark ? '#f8fafc' : '#0f172a', size: 13 } },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: bgCol,
            xaxis: { title: 'Municipal Ward Node', color: txtCol, gridcolor: gridCol },
            yaxis: { title: 'Pressure (Bar)', color: txtCol, gridcolor: gridCol },
            margin: { l: 50, r: 30, t: 40, b: 50 }
          }, { responsive: true, displayModeBar: false });

          // 3. 30-60-90 Deficit progression
          window.Plotly.newPlot('plotly-horizon', [
            { x: wards.map(w => w.ward_id.replace('WARD_', 'W')), y: wards.map(w => (w.forecasted_unmet_ratio * 35).toFixed(1)), name: '30-Day Deficit (%)', type: 'bar', marker: { color: '#10b981' } },
            { x: wards.map(w => w.ward_id.replace('WARD_', 'W')), y: wards.map(w => (w.forecasted_unmet_ratio * 100).toFixed(1)), name: '60-Day Deficit (%)', type: 'bar', marker: { color: '#f59e0b' } },
            { x: wards.map(w => w.ward_id.replace('WARD_', 'W')), y: wards.map(w => (w.forecasted_unmet_ratio * 180).toFixed(1)), name: '90-Day Deficit (%)', type: 'bar', marker: { color: '#ef4444' } }
          ], {
            title: { text: '30-60-90 Day Ward Deficit Progression (XGBoost Regressors)', font: { color: isDark ? '#f8fafc' : '#0f172a', size: 13 } },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: bgCol,
            barmode: 'group',
            xaxis: { title: 'Ward', color: txtCol, gridcolor: gridCol },
            yaxis: { title: 'Shortfall Deficit (%)', color: txtCol, gridcolor: gridCol },
            legend: { font: { color: txtCol } },
            margin: { l: 50, r: 30, t: 40, b: 50 }
          }, { responsive: true, displayModeBar: false });

          // 4. Reservoir Depletion Hydrographs
          window.Plotly.newPlot('plotly-reservoirs', [
            { x: ['Wk 1', 'Wk 6', 'Wk 12', 'Wk 18', 'Wk 24'], y: [1.97, 1.6, 1.2, 0.6, 1.8], name: 'Khadakwasla (1.97 TMC)', line: { color: '#0ea5e9', width: 2 } },
            { x: ['Wk 1', 'Wk 6', 'Wk 12', 'Wk 18', 'Wk 24'], y: [10.65, 8.4, 6.0, 3.0, 9.8], name: 'Panshet (10.65 TMC)', line: { color: '#f59e0b', width: 2.5 } },
            { x: ['Wk 1', 'Wk 6', 'Wk 12', 'Wk 18', 'Wk 24'], y: [53.57, 43.1, 31.5, 18.9, 48.0], name: 'Ujani (53.57 TMC)', line: { color: '#8b5cf6', width: 3 } }
          ], {
            title: { text: 'Multi-Reservoir Cascade Depletion Hydrographs', font: { color: isDark ? '#f8fafc' : '#0f172a', size: 13 } },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: bgCol,
            xaxis: { color: txtCol, gridcolor: gridCol },
            yaxis: { title: 'Live Storage (TMC)', color: txtCol, gridcolor: gridCol },
            legend: { font: { color: txtCol } },
            margin: { l: 50, r: 30, t: 40, b: 50 }
          }, { responsive: true, displayModeBar: false });
        }
      }, [currentView, treatyData, municipalData, theme]);

      const minLpcd = municipalData?.minimum_ward_lpcd ?? 55.0;
      const lpcdPass = minLpcd >= 55.0;
      const wards = municipalData?.ward_details ?? [];
      const filteredWards = wards.filter(w => 
        w.ward_name.toLowerCase().includes(searchFilter.toLowerCase()) ||
        w.ward_id.toLowerCase().includes(searchFilter.toLowerCase())
      );

      const optimalA = treatyData?.optimal_release_state_a_tmc?.toFixed(1) ?? '38.9';
      const optimalB = treatyData?.optimal_release_state_b_tmc?.toFixed(1) ?? '44.9';
      const maximinScore = treatyData?.maximin_security_score?.toFixed(3) ?? '0.724';
      const evapLoss = treatyData?.evaporative_loss_tmc?.toFixed(2) ?? '2.85';
      const secA = treatyData?.state_a_security ?? 0.74;
      const secB = treatyData?.state_b_security ?? 0.72;
      const paretoPoints = treatyData?.pareto_points ?? [
        [0.15, 0.92], [0.35, 0.88], [0.55, 0.82], [0.72, 0.74], [0.85, 0.45], [0.93, 0.20]
      ];

      return (
        <div className="min-h-screen flex flex-col font-sans transition-colors duration-200">
          
          {/* ========================================================================= */}
          {/* UPGRADED SPACIOUS HEADER WITH NO CLIPPING & WHITE-YELLOW / DARK PALETTE   */}
          {/* ========================================================================= */}
          <header className="sticky top-0 z-50 transition-colors duration-200 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-amber-200/80 dark:border-amber-500/20 shadow-sm">
            
            {/* ROW 1: BRAND LOGO + BASIN SELECTOR + VIEWPORTS + THEME TOGGLE */}
            <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                
                {/* Brand & Identity */}
                <div className="flex items-center space-x-3.5">
                  <div className="h-11 w-11 rounded-xl bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-600 p-0.5 shadow-md shadow-amber-500/20 flex-shrink-0">
                    <div className="h-full w-full bg-white dark:bg-slate-950 rounded-[10px] flex items-center justify-center font-black text-amber-600 dark:text-amber-400 text-lg">
                      Δ
                    </div>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2.5">
                      <span className="font-extrabold text-lg tracking-tight text-slate-900 dark:text-white">
                        HDRE <span className="text-amber-600 dark:text-amber-400">/ R2C Ai</span>
                      </span>
                      <span className="text-[11px] font-mono px-2 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700/60 uppercase">
                        v2.4 Prod
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                      Hydro-Diplomacy & Resilience Engine · Closed-Loop Treaty-to-Tap Operating System
                    </p>
                  </div>
                </div>

                {/* Basin & Stressor Dropdown */}
                <div className="flex items-center space-x-2 bg-amber-50/70 dark:bg-slate-950/70 border border-amber-200 dark:border-slate-800 rounded-lg px-3 py-1.5 text-xs font-mono">
                  <span className="text-amber-700 dark:text-amber-400 font-bold hidden sm:inline">Basin:</span>
                  <span className="text-slate-800 dark:text-slate-200 font-semibold">Krishna-Bhima</span>
                  <span className="text-amber-300 dark:text-slate-700">|</span>
                  <select
                    value={scenario}
                    onChange={(e) => setScenario(e.target.value)}
                    className="bg-transparent text-amber-800 dark:text-amber-300 font-bold focus:outline-none cursor-pointer max-w-[280px] truncate"
                  >
                    <option value="2026_DROUGHT_RCP85" className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200">
                      2026 Severe Drought (-30% Monsoon, +2.5°C)
                    </option>
                    <option value="BASELINE_MONSOON" className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200">
                      Historical Baseline (Normal Monsoon)
                    </option>
                    <option value="COMPOUND_HEATWAVE_RCP85" className="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-200">
                      Compound Multi-Decade Heatwave (+3.5°C)
                    </option>
                  </select>
                </div>

                {/* Navigation Viewport Mode Switcher + Light/Dark Toggle */}
                <div className="flex items-center flex-wrap gap-2">
                  <div className="flex items-center space-x-1 bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800">
                    <button
                      onClick={() => setCurrentView('treaty')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        currentView === 'treaty'
                          ? 'bg-amber-500 text-slate-950 shadow-sm font-extrabold'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      Macro Treaty
                    </button>

                    <button
                      onClick={() => setCurrentView('municipal')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        currentView === 'municipal'
                          ? 'bg-amber-500 text-slate-950 shadow-sm font-extrabold'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      Municipal Cockpit
                    </button>

                    <button
                      onClick={() => setCurrentView('closed-loop')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        currentView === 'closed-loop'
                          ? 'bg-amber-500 text-slate-950 shadow-sm font-extrabold'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      Treaty-to-Tap
                    </button>

                    <button
                      onClick={() => setCurrentView('analytics')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        currentView === 'analytics'
                          ? 'bg-amber-500 text-slate-950 shadow-sm font-extrabold'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      Analytics
                    </button>
                  </div>

                  {/* LIGHT / DARK MODE TOGGLE BUTTON */}
                  <button
                    onClick={toggleTheme}
                    className="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border font-mono text-xs font-bold transition-all bg-amber-50 dark:bg-slate-800 border-amber-300 dark:border-slate-700 text-amber-900 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-slate-700 shadow-sm cursor-pointer"
                    title="Toggle Light / Dark Mode"
                  >
                    <span>{theme === 'light' ? '🌙 Dark' : '☀️ Light'}</span>
                  </button>
                </div>

              </div>
            </div>

            {/* ROW 2: LIVE TELEMETRY TICKER RIBBON (CLEAN & SPACIOUS) */}

                            const fill = cat === 'SAFE' ? '#10b981' : (cat === 'ALERT' ? '#f59e0b' : '#ef4444');
                            const coords = feature.geometry.coordinates[0];
                            const pathStr = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c[0]} ${18.60 - (c[1] - 18.44)}`).join(' ') + ' Z';
                            const centroid = [feature.properties.centroid_lon, 18.60 - (feature.properties.centroid_lat - 18.44)];

                            return (
                              <g key={wid} className="cursor-pointer" onClick={() => setSelectedWard(wardStat)}>
                                <path
                                  d={pathStr}
                                  fill={fill}
                                  fillOpacity={isSelected ? 0.9 : 0.45}

                                >
                                  {wid.replace('WARD_', 'W')}
                                </text>
                              </g>
                            );
                          })}
